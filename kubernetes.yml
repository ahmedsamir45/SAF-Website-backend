apiVersion: apps/v1
kind: Deployment
metadata:
  name: saf-backend
  labels:
    app: saf-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saf-backend
  template:
    metadata:
      labels:
        app: saf-backend
    spec:
      containers:
      - name: saf-backend
        image: your-registry/saf-backend:latest  # Update this with your actual image path
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: saf-secrets
              key: secret-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: saf-secrets
              key: database-url
        - name: ALLOWED_HOSTS
          value: "saf-website-backend-backend-only-f6d2c1c.kuberns.cloud,localhost,127.0.0.1"
        - name: DB_SSL
          value: "true"
        - name: CSRF_TRUSTED_ORIGINS
          value: "https://saf-website-backend-backend-only-f6d2c1c.kuberns.cloud"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://saf-website-backend-backend-only-f6d2c1c.kuberns.cloud"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: saf-backend-service
spec:
  selector:
    app: saf-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: saf-secrets
type: Opaque
data:
  # Generate these values using: echo -n 'your-secret' | base64
  secret-key: YOUR_BASE64_ENCODED_SECRET_KEY
  database-url: YOUR_BASE64_ENCODED_DATABASE_URL
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saf-backend-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: saf-website-backend-backend-only-f6d2c1c.kuberns.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saf-backend-service
            port:
              number: 80
