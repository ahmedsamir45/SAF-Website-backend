<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff;">
        <div style="background-color: #2c3e50; padding: 20px; text-align: center;">
            <h1 style="color: #ffffff; margin: 0;">SAF Programs</h1>
        </div>
        
        <div style="padding: 20px;">
            {% block content %}{% endblock %}
        </div>
        
        <div style="background-color: #f9f9f9; padding: 20px; text-align: center; font-size: 12px; color: #7f8c8d; border-top: 1px solid #eee;">
            <p>© {% now "Y" %} SAF Programs. All rights reserved.</p>
            <p>Contact us at: {{ contact_email }}</p>
        </div>
    </div>
</body>
</html>
